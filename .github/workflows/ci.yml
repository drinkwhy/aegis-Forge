name: Aegis Forge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.23'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # Go Services
  # ============================================================
  go-lint-test:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m
          working-directory: .

      - name: Run Go tests
        run: |
          go test ./services/control-plane/...  -v -race -coverprofile=coverage-control-plane.out
          go test ./libs/canary-sdk/...         -v -race -coverprofile=coverage-canary.out
          go test ./libs/aegisagent/...         -v -race -coverprofile=coverage-aegisagent.out
          go test ./libs/roe-validator/...      -v -race -coverprofile=coverage-roe.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-*.out
          flags: go

  # ============================================================
  # Python Services
  # ============================================================
  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Lint attack-generator
        working-directory: services/attack-generator
        run: |
          uv pip install --system ruff mypy
          ruff check src/
          mypy src/ --ignore-missing-imports

      - name: Lint evaluator-agent
        working-directory: services/evaluator-agent
        run: |
          ruff check src/
          mypy src/ --ignore-missing-imports

      - name: Lint analysis-engine
        working-directory: services/analysis-engine
        run: |
          ruff check src/
          mypy src/ --ignore-missing-imports

      - name: Validate attack corpus schema
        run: |
          uv pip install --system jsonschema pyyaml
          python scripts/validate_corpus.py

  # ============================================================
  # Next.js Dashboard
  # ============================================================
  nextjs-build:
    name: Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web run lint

      - name: Type check
        run: pnpm --filter web exec tsc --noEmit

      - name: Build
        run: pnpm --filter web run build
        env:
          NEXT_PUBLIC_API_URL: https://api.aegiscruc.io
          AUTH0_BASE_URL: https://app.aegiscruc.io

  # ============================================================
  # Terraform Validation
  # ============================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (dev)
        working-directory: infra/terraform/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate (dev)
        working-directory: infra/terraform/environments/dev
        run: terraform validate

  # ============================================================
  # Security Scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ============================================================
  # Required checks gate
  # ============================================================
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [go-lint-test, python-lint-test, nextjs-build, terraform-validate, security-scan]
    steps:
      - run: echo "All CI checks passed ✓"
