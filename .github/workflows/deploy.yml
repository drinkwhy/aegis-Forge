name: Aegis Forge — Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  id-token: write  # OIDC for AWS auth — no static keys
  contents: read

jobs:
  terraform-dev:
    name: Deploy Infrastructure (dev)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  deploy-services-dev:
    name: Deploy Services (dev)
    runs-on: ubuntu-latest
    needs: terraform-dev
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push control-plane
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/aegis-forge/control-plane:$IMAGE_TAG services/control-plane/
          docker push $ECR_REGISTRY/aegis-forge/control-plane:$IMAGE_TAG

      - name: Build and push attack-generator
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/aegis-forge/attack-generator:$IMAGE_TAG services/attack-generator/
          docker push $ECR_REGISTRY/aegis-forge/attack-generator:$IMAGE_TAG

      - name: Build and push evaluator-agent
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/aegis-forge/evaluator-agent:$IMAGE_TAG services/evaluator-agent/
          docker push $ECR_REGISTRY/aegis-forge/evaluator-agent:$IMAGE_TAG

      - name: Build and push web
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/aegis-forge/web:$IMAGE_TAG apps/web/
          docker push $ECR_REGISTRY/aegis-forge/web:$IMAGE_TAG

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name aegis-forge-dev --region us-east-1
          helm upgrade --install aegis-forge infra/helm/aegis-forge \
            --namespace aegis-forge \
            --create-namespace \
            --set global.imageTag=${{ github.sha }} \
            --set global.environment=dev \
            --wait --timeout=10m

  # Production deploy requires manual approval in GitHub Environments
  terraform-prod:
    name: Deploy Infrastructure (prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment: prod  # Requires manual approval in GitHub Settings
    defaults:
      run:
        working-directory: infra/terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
