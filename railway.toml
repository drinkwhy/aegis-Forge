[build]
builder = "NIXPACKS"
buildCommand = "npm install -g pnpm@9.15.4 && pnpm install --no-frozen-lockfile && pnpm --filter @aegis/web build"

[deploy]
startCommand = "pnpm --filter @aegis/web start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
